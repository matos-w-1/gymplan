<html lang="pt-PT">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>GYMPLAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone-width column, sticky header, fixed bottom tab bar like a kit-room app */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#13201A; --muted:#5A6B62; --line:#D7E0D9;
  --accent:#1E6B45; --accent-ink:#FFFFFF; --soft:#E1EEE6; --card:#F2C230; --card-ink:#2B2306;
  --carb:#C9971A; --fat:#7C68C9; --water:#2F7FC8; --danger:#B83A2E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --ink:#E5EEE8; --muted:#94A69B; --line:#25352B;
  --accent:#4FC387; --accent-ink:#06150D; --soft:#1C2E23; --card:#F2C94C; --card-ink:#241C02;
  --carb:#E2B33A; --fat:#A594EC; --water:#5AA8EE; --danger:#EF7A6D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --ink:#E5EEE8; --muted:#94A69B; --line:#25352B;
  --accent:#4FC387; --accent-ink:#06150D; --soft:#1C2E23; --card:#F2C94C; --card-ink:#241C02;
  --carb:#E2B33A; --fat:#A594EC; --water:#5AA8EE; --danger:#EF7A6D; color-scheme:dark}

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--bg);overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden}
/* app shell: só esta zona faz scroll; a barra de baixo é parte do layout, não fica "pendurada" */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.who{font-size:13px;color:var(--muted);text-align:right}
h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.notice{background:var(--card);color:var(--card-ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.tag.ball{background:var(--card);color:var(--card-ink)}
.tag.rest{background:transparent;border:1px solid var(--line);color:var(--muted)}

button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}

/* targets */
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.target{display:flex;flex-direction:column;gap:2px}
.target .num{font-size:26px;line-height:1}
.target small{font-size:12px;color:var(--muted)}
@media (max-width:420px){.targets{grid-template-columns:1fr 1fr;row-gap:14px}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;font-size:13px}
.track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.fill.c{background:var(--carb)} .fill.f{background:var(--fat)} .fill.k{background:var(--ink)}
.bar .num{font-size:15px;white-space:nowrap}

/* meal plan */
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:0}
.meal .time{font-family:var(--display);font-weight:600;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.meal ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.meal ul b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.day .d{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase}
.day .s{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.today .d{color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--card)}

.ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .spread b{font-weight:600}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.set{display:grid;grid-template-columns:18px 1fr 10px 1fr;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.set input{padding:6px;font-size:14px;text-align:center;width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .item{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}

/* food */
.adder{display:grid;grid-template-columns:76px 1fr auto;gap:8px}
.adder select#f-food{grid-column:1/-1}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .chip{color:var(--ink)}
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.entry:first-child{border-top:0}
.entry .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);padding:4px 8px;font-size:18px;line-height:1}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}

/* shop */
.cat{display:flex;flex-direction:column;gap:2px}
.check{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);padding:0}
.check .q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.check.done span:first-of-type{text-decoration:line-through;color:var(--muted)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:12px}
.seg button{border:0;background:transparent;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{content:"✓ "}

.water{display:flex;flex-direction:column;gap:12px}
.wbig{display:flex;align-items:baseline;gap:6px}
.wbig .num{font-size:34px;line-height:1}
.wtrack{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.wfill{height:100%;background:var(--water);border-radius:99px;transition:width .3s}
.wbtns{display:grid;grid-template-columns:repeat(3,1fr) 44px;gap:6px}
.wbtns button{padding:9px 6px;font-size:14px}
.slots{display:grid;gap:5px}
.slot{border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.slot b{font-family:var(--display);font-size:16px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.slot.ok{background:var(--soft);border-color:transparent}
.slot.ok b{color:var(--accent)}
.slot.late{border-color:var(--danger)}
.slot.late b{color:var(--danger)}
.slot.next{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}
.walert{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--soft)}
.walert.late{background:transparent;border:1px solid var(--danger);color:var(--danger)}

button.small{padding:5px 10px;font-size:13px}
button.big{width:100%;padding:15px;font-size:17px;border-radius:12px}
button:disabled{opacity:.4;cursor:default}
.lprog{display:flex;gap:4px}
.lprog span{flex:1;height:5px;border-radius:9px;background:var(--line)}
.lprog span.dn{background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.lprog span.on{background:var(--accent)}
.lsets{display:grid;gap:6px}
.lset{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.lset b{color:var(--muted);font-size:15px}
.lset.done{background:var(--soft);border-color:transparent}.lset.done b{color:var(--accent)}
.lset.cur{border-color:var(--accent)}.lset.cur b{color:var(--ink)}
.stepper{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;gap:6px;align-items:stretch}
.srow button{min-width:54px;padding:12px 6px;font-size:16px;font-family:var(--display);font-weight:600}
.sval{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;border:1px solid var(--line);padding:4px}
.sval b{font-size:30px;line-height:1.1}.sval small{color:var(--muted);font-size:12px}
.restbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:12px;background:var(--soft);text-align:center}
.restnum{font-size:52px;line-height:1;color:var(--accent)}
.lnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chip.prod{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;border-radius:12px;text-align:left}
.chip.prod small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.newp summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* chart */
.chartbox{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}

/* nav */
nav.tabs{position:relative;flex:0 0 auto;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;border-radius:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:8}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="scroll" id="scroller"><div class="wrap">
  <header class="top">
    <div class="brand">GYM<span>PLAN</span></div>
    <div class="who" id="who"></div>
  </header>
  <main id="view" class="wrap" style="padding-block:4px 8px"></main>
</div></div>
<nav class="tabs" aria-label="Secções"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const DAYS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DAYS_FULL=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const GOALS={massa:"Ganhar massa",recomp:"Ganhar massa e secar um pouco",perder:"Perder gordura"};

// per 100 g: kcal, P, C, G ; portion g
const FOODS=[
 ["Peito / bifinhos de frango (cru)",110,23,0,1.5,250],
 ["Bifinhos de peru (cru)",105,24,0,1,250],
 ["Frango assado (sem pele)",165,27,0,6,250],
 ["Salmão (cru)",200,20,0,13,200],
 ["Atum ao natural (escorrido)",110,25,0,1,112],
 ["Ovo (1 ovo ≈ 60 g)",143,13,1,10,180],
 ["Fiambre de peru",105,18,3,2,40],
 ["Queijo fatiado",300,27,1,21,40],
 ["Salsichas de frango",200,13,4,15,100],
 ["Carne picada de vaca (crua)",176,20,0,10,200],
 ["Hambúrguer de vaca (cru, 1 ≈ 150 g)",230,18,0,17,150],
 ["Bife de vaca magro (cru)",120,22,0,3.5,200],
 ["Bifinhos com cogumelos (bifes crus + cogumelos)",95,17,1.5,2,350],
 ["Pescada / peixe branco (cru)",80,17,0,1,250],
 ["Queijo fresco",160,11,3,11,100],
 ["Skyr / iogurte proteico",63,11,4,0.2,170],
 ["Whey (1 dose ≈ 30 g)",400,80,8,6,30],
 ["Leite meio-gordo",47,3.3,4.8,1.6,250],
 ["Arroz (cozido)",130,2.7,28,0.3,300],
 ["Massa / esparguete (cozida)",158,5.8,31,0.9,300],
 ["Batata (cozida / air fryer)",87,2,20,0.1,300],
 ["Batata-doce",86,1.6,20,0.1,300],
 ["Feijão preto (cozido)",132,8.9,23.7,0.5,150],
 ["Grão-de-bico (cozido)",139,7,22,2.5,150],
 ["Wrap / tortilha (1 ≈ 60 g)",300,8,50,7,60],
 ["Cogumelos",22,3.1,3.3,0.3,100],
 ["Pão integral",250,10,42,3.5,60],
 ["Flocos de aveia",380,13,60,7,50],
 ["Banana",89,1.1,23,0.3,120],
 ["Maçã / laranja",50,0.3,12,0.2,150],
 ["Legumes (brócolos, feijão-verde…)",30,2.5,5,0.3,200],
 ["Azeite",884,0,0,100,10],
 ["Amêndoas / nozes",600,20,15,52,30],
 ["Manteiga de amendoim",600,25,16,50,20],
 ["Lindahls Protein (bebida 330 ml, 26 g prot.)",50,7.9,4.3,0.1,330]
].map(([n,k,p,c,g,por])=>({n,k,p,c,g,por}));
// peso de 1 unidade (g), nome singular, plural
const UNITS={"Lindahls Protein (bebida 330 ml, 26 g prot.)":[330,"garrafa","garrafas"],"Banana":[120,"banana","bananas"],"Maçã / laranja":[150,"peça","peças"],"Ovo (1 ovo ≈ 60 g)":[60,"ovo","ovos"],"Whey (1 dose ≈ 30 g)":[30,"dose","doses"],
 "Wrap / tortilha (1 ≈ 60 g)":[60,"wrap","wraps"],"Hambúrguer de vaca (cru, 1 ≈ 150 g)":[150,"hambúrguer","hambúrgueres"],"Skyr / iogurte proteico":[170,"copo","copos"],
 "Pão integral":[30,"fatia","fatias"],"Atum ao natural (escorrido)":[80,"lata","latas"],"Salmão (cru)":[180,"posta","postas"],"Fiambre de peru":[15,"fatia","fatias"],"Queijo fatiado":[20,"fatia","fatias"],"Salsichas de frango":[50,"salsicha","salsichas"]};
FOODS.forEach(f=>{const u=UNITS[f.n];if(u){f.u=u[0];f.un=u[1];f.unp=u[2]}});
const fi=n=>FOODS.findIndex(f=>f.n===n);
const QUICK=[["1 banana","Banana",1],["1 Lindahls","Lindahls Protein (bebida 330 ml, 26 g prot.)",1],["1 maçã ou laranja","Maçã / laranja",1],["3 ovos","Ovo (1 ovo ≈ 60 g)",3],["1 shake","Whey (1 dose ≈ 30 g)",1],["1 skyr","Skyr / iogurte proteico",1],["2 fatias de pão","Pão integral",2],["1 lata de atum","Atum ao natural (escorrido)",1]];
// produtos do próprio utilizador (refeições prontas, etc.): valores por embalagem/porção
const DEFAULT_CUSTOM=[{id:"wholly-ragu",n:"Wholly Conchiglie al Ragù",k:480,p:41,c:45,g:15},{id:"cont-carbonara",n:"Tagliatelle Carbonara Continente (300 g)",k:531,p:20,c:53,g:26.4}];
const myProducts=()=>S.custom||DEFAULT_CUSTOM;
function entryInfo(e){if(e.c){const q=e.q||1;return{n:e.c.n,k:e.c.k*q,p:e.c.p*q,c:e.c.c*q,g:e.c.g*q,label:q==1?"1 porção":`${String(q).replace(".",",")} porções`}}
  const f=FOODS[e.f],m=e.g/100;return{n:f.n,k:f.k*m,p:f.p*m,c:f.c*m,g:f.g*m,label:qtyLabel(e)}}
let manage=false;
const qtyLabel=e=>{const f=FOODS[e.f];return e.q&&f.u?`${e.q} ${e.q==1?f.un:f.unp}`:`${e.g} g`};

const EX={
 PC:{name:"Peito + Costas",list:[["Supino inclinado com halteres","4×8–10"],["Supino plano","3×8–10"],["Peck deck","3×12"],["Puxada ao peito","4×8–10"],["Remada com barra ou máquina","4×8–10"],["Remada unilateral","3×10"]]},

/* ---------- calculations ---------- */
function targets(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="f"?-161:5);
  const factor=Math.min(1.9,1.2+0.055*p.gym+0.07*p.foot.length);
  const tdee=bmr*factor;
  const adj={massa:300,recomp:-250,perder:-500}[p.goal];
  const kcal=r10(tdee+adj);
  const prot=Math.min(220,Math.round(p.weight*(p.goal==="massa"?1.8:2.0)));
  const fat=Math.round(p.weight*0.9);
  const carb=Math.max(100,Math.round((kcal-prot*4-fat*9)/4));
  const water=Math.round(p.weight*35/100)/10;
  const creat=p.weight<70?3:5;
  return{bmr,tdee:Math.round(tdee),kcal,prot,fat,carb,water,creat};
}
function schedule(p){
  const pick={3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5]}[p.gym]||[0,2,4];
  const tpl={3:["PC","BO","PE"],4:["PC","BO","PE","SC"],5:["PC","BO","PE","PC","BO"],6:["PC","BO","PE","PC","BO","PE"]}[p.gym]||["PC","BO","PE"];
  const dist=d=>{if(p.foot.includes(d))return 0;for(let i=1;i<8;i++)if(p.foot.includes((d+i)%7))return i;return 7};
  const legsCount=tpl.filter(t=>t==="PE").length;
  const ranked=[...pick].sort((a,b)=>dist(b)-dist(a)||a-b);
  const legDays=ranked.slice(0,legsCount);
  const others=tpl.filter(t=>t!=="PE");
  const week=Array(7).fill(null);let oi=0;
  pick.forEach(d=>{week[d]=legDays.includes(d)?"PE":others[oi++]});
  return week;
}
function mealPlan(p,t,dayIdx){
  const gym=schedule(p)[dayIdx], ball=p.foot.includes(dayIdx);
  const {meat,carbG}=portions(t);
  const raw=r10(carbG*0.36), prots=likedNames("P"), carbsTxt=likedNames("C");
  const meals=[];
  const lin=liked("lindahls");
  if(gym)meals.push(["10:00","Pequeno-almoço, antes do ginásio",lin?["<b>1 banana + 1 Lindahls Protein</b> (26 g de proteína, leve no estômago)"]:["<b>1 banana</b> ou <b>1 skyr</b> (algo leve, mesmo sem fome)"]]);
  else meals.push(["10:00","Pequeno-almoço",lin?["<b>1 banana + 1 Lindahls Protein</b>","Com mais fome: junta <b>2–3 ovos mexidos</b> com fiambre"]:["<b>3 ovos mexidos</b> com 2 fatias de fiambre e queijo","<b>1 banana</b>"]]);
  if(gym)meals.push(["12:30","Pós-treino",["<b>Shake de whey (30 g)</b> com água ou leite",`<b>Creatina ${t.creat} g</b> (${t.creat} comprimidos de 1 g)`]]);
  meals.push(["13:00","Almoço",[`<b>${meat} g</b> de ${prots} (pesado cru)`,`<b>${carbG} g</b> de ${carbsTxt} (cozidos; arroz ≈ ${raw} g cru)`,"Legumes à vontade + <b>1 colher</b> de azeite"]]);
  meals.push(["16:30","Lanche",["<b>Skyr 170 g + 40 g de aveia</b> + 1 peça de fruta","<b>2 fatias de pão integral</b> com fiambre de peru"]]);
  if(ball)meals.push(["19:00","Jantar (2 h antes do futebol)",[`<b>${meat} g</b> de frango ou atum com <b>${carbG} g</b> de massa ou arroz`,"Leve em gordura, para não pesar no jogo"]]);
  else meals.push(["20:30","Jantar",[`<b>${meat} g</b> de ${likedNames("P",4)}`,`<b>${r10(carbG*1.15)} g</b> de ${carbsTxt}${liked("feijao")?", ou metade em feijão preto":""}`,"Legumes + <b>1 colher</b> de azeite"]]);
  if(ball)meals.push(["22:30","Depois do futebol",[`<b>1 ${lin?"Lindahls":"skyr"}</b> ou <b>shake</b> + 1 peça de fruta`]]);
  if(!gym)meals.push(["","Creatina",[`<b>${t.creat} g</b> também hoje, a qualquer hora`]]);
  return meals;
}

function shopping(p,t){
  const f=t.prot/180,{meat,carbG}=portions(t);
  const mains=ALL_ITEMS.filter(x=>x[2]==="P"&&liked(x[0])).length||1;
  const carbs=ALL_ITEMS.filter(x=>x[2]==="C"&&liked(x[0])).length||1;
  const meatShare=meat*14*0.8/1000/mains;   // 2 refeições × 7 dias, 20% vem de ovos/atum
  const carbShare=carbG*14/1000/carbs;
  const kg=v=>Math.max(0.5,Math.round(v*2)/2).toLocaleString("pt-PT")+" kg";
  const out={};
  for(const [cat,items] of Object.entries(CATALOG)){
    const rows=items.filter(x=>liked(x[0])).map(([id,name,kind,a,b])=>{
      let q;
      if(kind==="P")q=a==="kg"?kg(meatShare):Math.max(2,Math.round(meatShare/b))+" "+a;
      else if(kind==="C")q=b<1?Math.max(1,Math.round(carbShare*b)).toLocaleString("pt-PT")+" kg":kg(carbShare*b);
      else if(kind==="n")q=Math.max(1,Math.round(a*f))+" "+b;
      else if(kind==="cr")q=`${t.creat} g/dia ≈ ${t.creat*30} comp./mês`;
      else q=a;
      return[id,name,q];
    });
    if(rows.length)out[cat]=rows;
  }
  return out;
}

function waterGoal(p,t,i){return Math.round((t.water+(p.foot.includes(i)?0.5:0))*1000/250)*250}
function waterPlan(p,t,i){
  const goal=waterGoal(p,t,i),gym=!!schedule(p)[i],out=[];
  const times=gym?[13,15,17,19]:[11,13,15,17,19];
  let start=0;if(gym){start=Math.min(1500,goal);out.push([12.5,start,"Ginásio"])}
  const step=(goal-start)/times.length;
  times.forEach((h,k)=>out.push([h,Math.round((start+step*(k+1))/50)*50,""]));
  out[out.length-1][1]=goal;return out;
}
const hh=h=>`${Math.floor(h)}:${h%1?"30":"00"}`;

const noKg=n=>/Prancha/.test(n);
function startVals(n,sch){const last=lastFor(n),ps=parseSch(sch);return{kg:noKg(n)?0:(last?last.kg:(/Elevações|Curl|Face|Extensão|Tríceps|halteres|unilateral/.test(n)?10:20)),reps:last&&last.reps?last.reps:ps.hi}}
function restFor(w){return w==="BO"?75:90}
function liveStart(w){const s=EX[w],v=startVals(s.list[0][0],s.list[0][1]);S.live={date:iso(),w,day:selDay,ex:0,set:0,data:s.list.map(()=>[]),kg:v.kg,reps:v.reps,restEnd:0};save()}
function liveGoEx(k){const L=S.live,s=EX[L.w];L.ex=k;L.set=L.data[k].length;const prev=L.data[k][L.data[k].length-1],v=prev?{kg:prev[0],reps:prev[1]}:startVals(s.list[k][0],s.list[k][1]);L.kg=v.kg;L.reps=v.reps;L.restEnd=0;save()}
function liveFinish(){const L=S.live,s=EX[L.w];const ex=s.list.map(([n],k)=>({n,sets:L.data[k]})).filter(x=>x.sets.length);
  if(ex.length)S.workouts.push({date:L.date,day:s.name,ex});delete S.live;save();toast(ex.length?"Treino guardado":"Treino cancelado")}
let restTimer=null;
function tickRest(){clearInterval(restTimer);const el=$("#rest");if(!el||!S.live||!S.live.restEnd)return;
  const f=()=>{const left=Math.ceil((S.live.restEnd-Date.now())/1000);if(left<=0){clearInterval(restTimer);S.live.restEnd=0;save();render();toast("Bora, próxima série");return}
    const e=$("#rest");if(e)e.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`};f();restTimer=setInterval(f,500)}
function viewLive(){
  const L=S.live,s=EX[L.w],[n,sch]=s.list[L.ex],ps=parseSch(sch),last=lastFor(n),total=s.list.length;
  const doneEx=L.data.filter((d,k)=>d.length>=parseSch(s.list[k][1]).sets).length;
  const exDone=L.data[L.ex].length>=ps.sets;
  const setsHtml=Array.from({length:Math.max(ps.sets,L.data[L.ex].length)},(_,i)=>{const d=L.data[L.ex][i];return `<div class="lset ${d?"done":i===L.data[L.ex].length?"cur":""}"><span>${i+1}</span><b class="num">${d?(noKg(n)?"":d[0].toLocaleString("pt-PT")+" kg × ")+d[1]+(ps.secs?" s":""):"—"}</b></div>`}).join("");
  const step=(id,label,val,unit,btns)=>`<div class="stepper"><div class="label">${label}</div><div class="srow" style="grid-template-columns:${btns.length===4?"auto auto 1fr auto auto":"1fr 1.4fr 1fr"}">${btns.filter(b=>b<0).map(b=>`<button data-step="${id}" data-by="${b}" aria-label="${b} ${unit}">${String(b).replace(".",",")}</button>`).join("")}<div class="sval"><b class="num">${val.toLocaleString("pt-PT")}</b><small>${unit}</small></div>${btns.filter(b=>b>0).map(b=>`<button data-step="${id}" data-by="${b}" aria-label="+${b} ${unit}">+${String(b).replace(".",",")}</button>`).join("")}</div></div>`;
  const resting=L.restEnd&&L.restEnd>Date.now();
  const controls=()=>`${noKg(n)?"":step("kg","Peso",L.kg,"kg",[-5,-2.5,2.5,5])}${step("reps",ps.secs?"Tempo":"Repetições",L.reps,ps.secs?"seg":"reps",ps.secs?[-5,5]:[-1,1])}
     <button class="primary big" id="set-done">✓ Série ${L.data[L.ex].length+1} feita</button>`;
  return `<section class="panel live">
   <div class="spread"><div class="label">${s.name} · exercício ${L.ex+1} de ${total}</div><button class="ghost small" id="live-quit">Sair</button></div>
   ${quitAsk?`<div class="confirm"><span>Sair do treino?</span><button class="primary" id="quit-save">Guardar o que fiz</button><button class="danger" id="quit-drop">Descartar</button><button class="ghost" id="quit-no">Continuar</button></div>`:""}
   <div class="lprog">${s.list.map((_,k)=>`<span class="${k===L.ex?"on":L.data[k].length?"dn":""}"></span>`).join("")}</div>
   <div><h2>${n}</h2><p class="muted"><span class="num">${sch}</span>${last?` · última vez <b class="num">${noKg(n)?"":last.kg.toLocaleString("pt-PT")+" kg × "}${last.reps}</b>`:""}</p></div>
   <div class="lsets" style="grid-template-columns:repeat(${Math.min(4,Math.max(ps.sets,L.data[L.ex].length))},minmax(0,1fr))">${setsHtml}</div>
   ${resting?`<div class="restbox"><div class="label">Descanso</div><div class="restnum num" id="rest">1:30</div><button class="ghost" id="rest-skip">Saltar descanso</button></div>${controls()}`:
    exDone?`<div class="restbox"><div class="label">Exercício feito</div><p class="muted">${L.ex<total-1?"Passa ao próximo ou faz mais uma série.":"Último exercício feito. Guarda o treino."}</p></div>`:
    controls()}
   ${L.data[L.ex].length?`<button class="ghost" id="set-undo">Desfazer última série</button>`:""}
   <div class="lnav">
     <button class="ghost" id="ex-prev" ${L.ex===0?"disabled":""}>← Anterior</button>
     ${L.ex<total-1?`<button class="${exDone?"primary":"ghost"}" id="ex-next">${exDone?"Próximo exercício →":"Saltar →"}</button>`:`<button class="primary" id="live-save">Terminar e guardar</button>`}
   </div>
   <p class="hint">${doneEx} de ${total} exercícios completos. Podes fechar a app: o treino fica guardado a meio.</p>
  </section>
  ${L.ex<total-1?`<section class="panel"><h3>A seguir</h3><p class="muted">${s.list.slice(L.ex+1).map(x=>x[0]).join(" · ")}</p></section>`:""}`;
}
function viewTreino(){
  const p=S.profile,week=schedule(p);
  if(S.live&&S.live.date===iso())return viewLive();
  if(S.live&&S.live.date!==iso())liveFinish();
  const w=week[selDay];
  const weekHtml=`<div class="week">${DAYS.map((d,i)=>`<div class="day ${i===selDay?"sel":""} ${i===todayIdx()?"today":""}" data-day="${i}" role="button" tabindex="0"><span class="d">${d}</span><span class="s">${week[i]?EX[week[i]].name.split(" + ")[0]:"—"}</span>${p.foot.includes(i)?'<span class="dot" title="Futebol"></span>':""}</div>`).join("")}</div>`;
  let body;
  if(!w){body=`<section class="panel"><h3>${DAYS_FULL[selDay]}</h3><p class="muted">${p.foot.includes(selDay)?(selDay===6?"Dia de jogo. Sem ginásio, come bem 3 h antes e hidrata.":"Futebol à noite. Sem ginásio extra."):"Descanso. A creatina toma-se na mesma."}</p></section>`}
  else{
    const s=EX[w];
    body=`<section class="panel">
      <div class="spread"><div><div class="label">${DAYS_FULL[selDay]}</div><h2>${s.name}</h2></div>${p.foot.includes(selDay)?'<span class="tag ball">Futebol à noite</span>':""}</div>
      ${w==="PE"?'<p class="hint">Sem ir à falha nas pernas, para chegares fresco ao futebol.</p>':""}
      <div>${s.list.map(([n,sch])=>{const last=lastFor(n);return `<div class="ex"><div class="spread"><b>${n}</b><span class="num muted">${sch}</span></div>${last?`<div class="hint">Última vez: <b class="num">${noKg(n)?"":last.kg.toLocaleString("pt-PT")+" kg × "}${last.reps}</b></div>`:""}</div>`}).join("")}</div>
      <button class="primary big" id="live-start" data-w="${w}">Começar treino</button>
    </section>`;
  }
  const hist=S.workouts.slice(-6).reverse();
  return `${exampleBanner()}<section class="panel"><div class="spread"><h3>A tua semana</h3><span class="hint"><span class="dot" style="display:inline-block"></span> futebol</span></div>${weekHtml}</section>${body}
  <section class="panel"><h3>Últimos treinos</h3>${hist.length?`<div class="hist">${hist.map(h=>`<div class="item"><span>${new Date(h.date).toLocaleDateString("pt-PT",{weekday:"short",day:"numeric",month:"short"})} · ${esc(h.day)}</span><span class="num muted">${h.ex.reduce((a,e)=>a+e.sets.length,0)} séries</span></div>`).join("")}</div>`:`<div class="empty">Ainda sem treinos. Carrega em <b>Começar treino</b> no dia de ginásio.</div>`}</section>`;
}

function chart(W){
  const w=520,h=200,pl=36,pr=12,pt=14,pb=26;
  const ys=W.map(x=>x.kg),min=Math.floor(Math.min(...ys)-1),max=Math.ceil(Math.max(...ys)+1);
  const t0=new Date(W[0].date).getTime(),t1=Math.max(t0+864e5,new Date(W[W.length-1].date).getTime());
  const X=d=>pl+(new Date(d).getTime()-t0)/(t1-t0)*(w-pl-pr),Y=v=>pt+(max-v)/(max-min)*(h-pt-pb);
  const ticks=[min,(min+max)/2,max];
  const pts=W.map(x=>`${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
  const last=W[W.length-1];
  return `<div class="chartbox"><svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolução do peso">
   ${ticks.map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${(Math.round(v*10)/10).toLocaleString("pt-PT")}</text>`).join("")}
   <polygon points="${X(W[0].date)},${h-pb} ${pts} ${X(last.date)},${h-pb}" fill="var(--soft)"/>
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
   ${W.map(x=>`<circle cx="${X(x.date)}" cy="${Y(x.kg)}" r="3" fill="var(--accent)"/>`).join("")}
   <circle cx="${X(last.date)}" cy="${Y(last.kg)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
   <text x="${pl}" y="${h-6}">${new Date(W[0].date).toLocaleDateString("pt-PT",{day:"numeric",month:"short"})}</text>
   <text x="${w-pr}" y="${h-6}" text-anchor="end">${new Date(last.date).toLocaleDateString("pt-PT",{day:"numeric",month:"short"})}</text>
  </svg></div>`;
}

   ${W.length>1?chart(W):`<div class="empty">Pesa-te uma vez por semana, de manhã e em jejum. Com dois registos aparece aqui o gráfico.</div>`}

function top0(){const sc=$("#scroller");if(sc)sc.scrollTop=0}
function addCustom(c){const d=iso();(S.food[d]=S.food[d]||[]).push({c:{n:c.n,k:c.k,p:c.p,c:c.c,g:c.g},q:1});save();render();toast("+ "+c.n)}
function addFood(f,q,g,msg){const d=iso(),e={f,g:Math.round(g)};if(q)e.q=q;(S.food[d]=S.food[d]||[]).push(e);save();render();toast(msg||"Adicionado")}
function render(){
  renderTabs();
  $("#who").textContent=S.profile.example?"perfil de exemplo":`${S.profile.name} · ${S.profile.weight} kg`;
  clearInterval(restTimer);
  $("#view").innerHTML={hoje:viewHoje,treino:viewTreino,comida:viewComida,peso:viewPeso,compras:viewCompras,perfil:viewPerfil}[tab]();
  tickRest();
}
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){tab=go.dataset.go;if(go.dataset.mode)shopMode=go.dataset.mode;render();top0();return}
  const qk=e.target.closest("[data-quick]");if(qk){const [l,n,q]=QUICK[+qk.dataset.quick],i=fi(n);addFood(i,q,q*FOODS[i].u,"+ "+l);return}
  const wb=e.target.closest("[data-water]");if(wb){S.water=S.water||{};const d=iso();S.water[d]=Math.max(0,(S.water[d]||0)+ +wb.dataset.water);save();render();if(+wb.dataset.water>0)toast("+ "+wb.dataset.water+" ml");return}
  const st=e.target.closest("[data-step]");if(st&&S.live){const k=st.dataset.step;S.live[k]=Math.max(0,Math.round((S.live[k]+ +st.dataset.by)*10)/10);save();render();return}
  if(e.target.closest("#live-start")){const b=e.target.closest("#live-start");liveStart(b.dataset.w);render();top0();return}
  if(e.target.closest("#set-done")){const L=S.live;L.data[L.ex].push([L.kg,L.reps]);const ps=parseSch(EX[L.w].list[L.ex][1]);L.restEnd=L.data[L.ex].length<ps.sets?Date.now()+restFor(L.w)*1000:0;save();render();return}
  if(e.target.closest("#set-undo")){const L=S.live;const d=L.data[L.ex].pop();if(d){L.kg=d[0];L.reps=d[1]}L.restEnd=0;save();render();return}
  if(e.target.closest("#rest-skip")){S.live.restEnd=0;save();render();return}
  if(e.target.closest("#ex-next")){liveGoEx(S.live.ex+1);render();top0();return}
  if(e.target.closest("#ex-prev")){liveGoEx(S.live.ex-1);render();top0();return}
  if(e.target.closest("#live-save")){liveFinish();render();return}
  if(e.target.closest("#live-quit")){quitAsk=true;render();return}
  if(e.target.closest("#quit-save")){quitAsk=false;liveFinish();render();return}
  if(e.target.closest("#quit-drop")){quitAsk=false;delete S.live;save();render();toast("Treino descartado");return}
  if(e.target.closest("#quit-no")){quitAsk=false;render();return}
  const cp=e.target.closest("[data-cp]");if(cp){const c=myProducts().find(x=>x.id===cp.dataset.cp);if(c)addCustom(c);return}
  const cpd=e.target.closest("[data-cpdel]");if(cpd){S.custom=myProducts().filter(x=>x.id!==cpd.dataset.cpdel);save();render();toast("Produto apagado");return}
  if(e.target.id==="cp-manage"){manage=!manage;render();return}
  const md=e.target.closest("[data-mode]");if(md){shopMode=md.dataset.mode;render();top0();return}
  const lk=e.target.closest("[data-like]");if(lk){const id=lk.dataset.like,L=[...likes()];S.likes=L.includes(id)?L.filter(x=>x!==id):L.concat(id);save();lk.setAttribute("aria-pressed",liked(id));return}
  if(e.target.id==="likes-reset"){delete S.likes;save();render();toast("Sugestões repostas");return}
  const day=e.target.closest("[data-day]");if(day){selDay=+day.dataset.day;render();return}
  const del=e.target.closest("[data-del]");if(del){S.food[iso()].splice(+del.dataset.del,1);save();render();return}
  const wd=e.target.closest("[data-wdel]");if(wd){S.weights=S.weights.filter(x=>x.date!==wd.dataset.wdel);save();render();return}
  if(e.target.id==="shop-clear"){S.shop={};save();render();return}
  if(e.target.id==="reset"){confirmReset=true;render();return}
  if(e.target.id==="reset-no"){confirmReset=false;render();return}
  if(e.target.id==="reset-yes"){try{localStorage.removeItem(KEY)}catch(_){}S=load();confirmReset=false;tab="perfil";render();toast("Dados apagados");return}
});
document.addEventListener("keydown",e=>{const d=e.target.closest&&e.target.closest("[data-day]");if(d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();d.click()}});
document.addEventListener("change",e=>{
  if(e.target.dataset.shop){S.shop[e.target.dataset.shop]=e.target.checked;save();render();return}
  if(e.target.id==="f-food"){foodSel=+e.target.value;foodUnit="u";render();return}
  if(e.target.id==="f-unit"){foodUnit=e.target.value;render();return}
  if(e.target.id&&e.target.id.startsWith("pr-f")){e.target.parentElement.className="tag "+(e.target.checked?"ball":"rest")}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="fform"){const v=parseFloat($("#f-g").value),fd=+$("#f-food").value,F=FOODS[fd];if(!v)return;const byU=F.u&&$("#f-unit").value==="u";
    addFood(fd,byU?v:null,byU?v*F.u:v)}
  if(f.id==="cform"){const num=id=>parseFloat($(id).value)||0;const c={id:"p"+Date.now(),n:$("#c-n").value.trim(),k:num("#c-k"),p:num("#c-p"),c:num("#c-c"),g:num("#c-g")};
    if(!c.n||!c.k)return;if($("#c-save").checked)S.custom=myProducts().concat(c);addCustom(c);return}
  if(f.id==="pform"){const kg=parseFloat($("#p-kg").value),date=$("#p-date").value;if(!kg||!date)return;S.weights=S.weights.filter(x=>x.date!==date).concat({date,kg});S.profile.weight=kg;save();render();toast("Peso registado")}
  if(f.id==="prof"){const foot=DAYS.map((_,i)=>$("#pr-f"+i).checked?i:-1).filter(i=>i>=0);
    S.profile={name:$("#pr-name").value.trim()||"Atleta",age:+$("#pr-age").value,sex:$("#pr-sex").value,height:+$("#pr-h").value,weight:+$("#pr-w").value,goal:$("#pr-goal").value,gym:+$("#pr-gym").value,foot,example:false};
    save();tab="hoje";render();top0();toast("Plano gerado")}
});
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
